<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tower Defense</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: #07090d;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #game {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
      }
      #game canvas { display: block; box-shadow: 0 0 60px rgba(0, 0, 0, 0.6); }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
